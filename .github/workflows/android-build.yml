name: Android Build (Debug APK)

on:
  workflow_dispatch:
  push:
    branches: [main, improvements]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache Gradle (safe)
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/wrapper
            ~/.gradle/caches/modules-2
            ~/.gradle/caches/build-cache-1
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', '**/settings.gradle*', '**/gradle.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Fix Gradle distribution permissions
        shell: bash
        run: |
          set -e
          # Try to download Gradle, ignore permission errors
          ./gradlew --version --no-daemon 2>/dev/null || true
          # Recursively fix all gradle binary permissions
          find "$HOME/.gradle/wrapper/dists/" -type f -name "gradle" -exec chmod +x {} \; 2>/dev/null || true
          find "$HOME/.gradle/wrapper/dists/" -type d -name "bin" -exec find {} -type f -exec chmod +x {} \; 2>/dev/null || true
          # Verify fix
          GRADLE_BIN=$(find "$HOME/.gradle/wrapper/dists/" -name "gradle" -type f 2>/dev/null | head -1)
          if [ -n "$GRADLE_BIN" ]; then
            ls -la "$GRADLE_BIN"
          fi

      - name: Clear Gradle transforms cache
        shell: bash
        run: rm -rf ~/.gradle/caches/transforms-*

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: NexusAI-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
