name: Auto Fix Kotlin + PR

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  fix-and-pr:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle (safe cache)
        uses: gradle/actions/setup-gradle@v3

      - name: Fix Gradle wrapper permission
        run: chmod +x gradlew

      - name: Run ktlint format
        run: ./gradlew ktlintFormat --no-daemon

      - name: Create Pull Request with changes
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "chore: auto format Kotlin code"
          title: "Auto fix Kotlin formatting"
          body: "PR automático com correções do ktlint"
          branch: auto-fix/kotlin-format
          base: main
          add-paths: |
            .